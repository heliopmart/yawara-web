version: '3.8'

services:
  ysna-core:
    build: .
    container_name: yawara_brain
    ports:
      - "8000:8000"  # Mapeia porta 8000 do container para 8000 do PC
    volumes:
      - .:/app       # Hot Reload: Espelha sua pasta local dentro do container
    env_file:
      - .env         # Carrega as variáveis de ambiente
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped